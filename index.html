<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome - BitScribbles</title>
    <meta name="description" content="A modern, precise metronome for musicians. Features adjustable BPM, multiple time signatures, and preset tempos.">

    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#16B3A3">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Metronome">

    <style>
        body { margin:0; padding:0; }
        @keyframes modalIn   { from{opacity:0;transform:scale(0.88) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);} }
        @keyframes beatPop   { 0%,100%{transform:scale(1);}50%{transform:scale(1.4);} }
        @keyframes floatUp   { 0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);} }
        @keyframes pulseGlow { 0%,100%{box-shadow:0 0 0 0 rgba(22,179,163,0.0),0 4px 20px rgba(20,23,28,0.3);}50%{box-shadow:0 0 0 6px rgba(22,179,163,0.15),0 4px 20px rgba(20,23,28,0.3);} }
        @keyframes modeSwitch { from{opacity:0;}to{opacity:1;} }
        .beat-amber { animation:beatPop 0.14s ease-out; box-shadow:0 0 14px rgba(242,177,52,0.9),0 0 28px rgba(242,177,52,0.4) !important; }
        .beat-teal  { animation:beatPop 0.14s ease-out; box-shadow:0 0 14px rgba(22,179,163,0.9),0 0 28px rgba(22,179,163,0.4) !important; }
        .btn-press  { transform:scale(0.92) !important; }
        input[type=range] { -webkit-appearance:none; appearance:none; height:5px; border-radius:99px; outline:none; cursor:pointer; width:100%; display:block; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#fff; cursor:pointer; box-shadow:0 1px 8px rgba(20,23,28,0.25),0 0 0 3px rgba(22,179,163,0.25); transition:box-shadow 0.2s; }
        input[type=range]::-webkit-slider-thumb:hover { box-shadow:0 1px 12px rgba(20,23,28,0.35),0 0 0 5px rgba(22,179,163,0.35); }
        input[type=range]::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:#fff; border:none; cursor:pointer; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // ── Icons ───────────────────────────────────────────────────────
    const Play = ({ size=24, fill="none" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    );
    const Pause = ({ size=24, fill="none" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    );
    const HelpCircle = ({ size=24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    );
    const Info = ({ size=24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    );
    const X = ({ size=24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const Sun = ({ size=16 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
    );
    const Moon = ({ size=16 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    );

    // ── Design tokens ───────────────────────────────────────────────
    const TEAL   = '#16B3A3';
    const PURPLE = '#6E56CF';
    const AMBER  = '#F2B134';
    const MONO    = "'JetBrains Mono', monospace";
    const GROTESK = "'Space Grotesk', sans-serif";
    const INTER   = "'Inter', sans-serif";
    const CAVEAT  = "'Caveat', cursive";

    const themes = {
        dark: {
            bg:             'linear-gradient(135deg, #14171C 0%, #1C1535 55%, #6E56CF 160%)',
            cardBg:         'rgba(250,250,249,0.06)',
            cardBorder:     'rgba(250,250,249,0.12)',
            cardShadow:     '0 24px 64px rgba(20,23,28,0.45), inset 0 1px 0 rgba(250,250,249,0.08)',
            modalBg:        'rgba(20,23,28,0.93)',
            btnBg:          'rgba(250,250,249,0.07)',
            btnBorder:      'rgba(250,250,249,0.14)',
            btnHover:       'rgba(250,250,249,0.13)',
            btnBorderHover: 'rgba(250,250,249,0.22)',
            text:           '#FAFAF9',
            textMid:        'rgba(250,250,249,0.65)',
            textDim:        'rgba(250,250,249,0.35)',
            textFaint:      'rgba(250,250,249,0.25)',
            textBody:       'rgba(250,250,249,0.78)',
            bpmColor:       '#FAFAF9',
            bpmShadow:      '0 0 40px rgba(22,179,163,0.3)',
            dotInactive:    'rgba(250,250,249,0.12)',
            dotBorder:      'rgba(250,250,249,0.18)',
            divider:        'rgba(250,250,249,0.10)',
            sliderTrack:    'rgba(250,250,249,0.12)',
            midColor:       '#6B7280',
            link:           TEAL,
        },
        light: {
            bg:             'linear-gradient(135deg, #e8f7f6 0%, #f0eeff 55%, #e2dcf8 100%)',
            cardBg:         'rgba(255,255,255,0.72)',
            cardBorder:     'rgba(20,23,28,0.08)',
            cardShadow:     '0 12px 48px rgba(20,23,28,0.12), inset 0 1px 0 rgba(255,255,255,0.9)',
            modalBg:        'rgba(250,250,249,0.97)',
            btnBg:          'rgba(20,23,28,0.05)',
            btnBorder:      'rgba(20,23,28,0.12)',
            btnHover:       'rgba(20,23,28,0.09)',
            btnBorderHover: 'rgba(20,23,28,0.2)',
            text:           '#14171C',
            textMid:        'rgba(20,23,28,0.65)',
            textDim:        'rgba(20,23,28,0.4)',
            textFaint:      'rgba(20,23,28,0.3)',
            textBody:       'rgba(20,23,28,0.75)',
            bpmColor:       '#14171C',
            bpmShadow:      '0 0 40px rgba(22,179,163,0.15)',
            dotInactive:    'rgba(20,23,28,0.10)',
            dotBorder:      'rgba(20,23,28,0.15)',
            divider:        'rgba(20,23,28,0.08)',
            sliderTrack:    'rgba(20,23,28,0.10)',
            midColor:       '#6B7280',
            link:           '#0e9688',
        },
    };

    // ── Components ──────────────────────────────────────────────────
    function Modal({ isOpen, onClose, title, children, t }) {
        if (!isOpen) return null;
        return (
            <div onClick={(e) => e.target === e.currentTarget && onClose()}
                style={{ position:'fixed', inset:0, zIndex:50, display:'flex', alignItems:'center', justifyContent:'center', padding:16, background:'rgba(20,23,28,0.6)', backdropFilter:'blur(10px)' }}>
                <div style={{ background:t.modalBg, backdropFilter:'blur(28px)', border:'1px solid ' + t.cardBorder, borderRadius:20, boxShadow:t.cardShadow, maxWidth:460, width:'100%', maxHeight:'88vh', overflowY:'auto', padding:28, animation:'modalIn 0.28s cubic-bezier(0.34,1.56,0.64,1)', transition:'background 0.3s' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:22 }}>
                        <h2 style={{ margin:0, fontFamily:GROTESK, fontWeight:700, fontSize:18, color:t.text }}>{title}</h2>
                        <button onClick={onClose} style={{ background:t.btnBg, border:'1px solid ' + t.btnBorder, borderRadius:12, padding:8, display:'flex', color:t.textMid, cursor:'pointer' }}>
                            <X size={17}/>
                        </button>
                    </div>
                    <div style={{ fontFamily:INTER, fontSize:14, lineHeight:1.65, color:t.textBody }}>{children}</div>
                </div>
            </div>
        );
    }

    function Section({ title, children }) {
        return (
            <div style={{ marginBottom:20 }}>
                <div style={{ fontFamily:MONO, fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:PURPLE, marginBottom:6 }}>{title}</div>
                <div>{children}</div>
            </div>
        );
    }

    function Toggle({ on, onToggle, label, t }) {
        return (
            <div style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer', userSelect:'none' }} onClick={onToggle}>
                <div style={{ width:36, height:20, borderRadius:99, position:'relative', transition:'background 0.25s', background: on ? TEAL : t.btnBorder, border:'1px solid ' + (on ? TEAL : t.btnBorder), flexShrink:0 }}>
                    <div style={{ position:'absolute', top:2, left: on ? 18 : 2, width:14, height:14, borderRadius:'50%', background:'#fff', boxShadow:'0 1px 4px rgba(0,0,0,0.2)', transition:'left 0.2s cubic-bezier(0.34,1.56,0.64,1)' }}/>
                </div>
                <span style={{ fontFamily:MONO, fontSize:11, letterSpacing:'0.06em', color: on ? t.text : t.textDim, transition:'color 0.2s' }}>{label}</span>
            </div>
        );
    }

    // ── Main App ────────────────────────────────────────────────────
    const Metronome = () => {
        const [dark, setDark] = useState(() => { try { return localStorage.getItem('bs-theme') !== 'light'; } catch { return true; } });
        const t = dark ? themes.dark : themes.light;
        const toggleTheme = () => setDark(d => { const next = !d; try { localStorage.setItem('bs-theme', next ? 'dark' : 'light'); } catch {} return next; });

        const [bpm, setBpm]                 = useState(120);
        const [isPlaying, setIsPlaying]     = useState(false);
        const [timeSig, setTimeSig]         = useState('4/4');
        const [currentBeat, setCurrentBeat] = useState(-1);
        const [presets, setPresets]         = useState(() => { try { const s = localStorage.getItem('metronome-presets'); return s ? JSON.parse(s) : [80,120,160]; } catch { return [80,120,160]; } });
        const [savedIdx, setSavedIdx]       = useState(null);
        const [audioReady, setAudioReady]   = useState(false);
        const [showHelp, setShowHelp]       = useState(false);
        const [showAbout, setShowAbout]     = useState(false);
        const [pressedBtn, setPressedBtn]   = useState(null);
        const [accentBeat, setAccentBeat]   = useState(() => { try { return localStorage.getItem('bs-accent') === 'true'; } catch { return false; } });
        const [upToEleven, setUpToEleven]   = useState(() => { try { return localStorage.getItem('bs-eleven') === 'true'; } catch { return false; } });

        const audioCtx     = useRef(null);
        const nextNote     = useRef(0);
        const schedulerRef = useRef(null);
        const bpmRef       = useRef(bpm);
        const beatRef      = useRef(0);
        const sigRef       = useRef(timeSig);
        const accentRef    = useRef(accentBeat);
        const elevenRef    = useRef(upToEleven);
        const lpTimer      = useRef(null);

        useEffect(() => { bpmRef.current = bpm; }, [bpm]);
        useEffect(() => {
            sigRef.current = timeSig;
            const newBeats = getBeats(timeSig);
            if (beatRef.current >= newBeats) {
                beatRef.current = 0;
            }
        }, [timeSig]);
        useEffect(() => { accentRef.current = accentBeat; }, [accentBeat]);
        useEffect(() => { elevenRef.current = upToEleven; }, [upToEleven]);

        const toggleAccent = () => setAccentBeat(a => {
            const next = !a;
            try { localStorage.setItem('bs-accent', String(next)); } catch {}
            return next;
        });

        const toggleEleven = () => setUpToEleven(e => {
            const next = !e;
            try { localStorage.setItem('bs-eleven', String(next)); } catch {}
            return next;
        });

        const getBeats = (s) => ({'2/4':2,'3/4':3,'4/4':4,'5/4':5,'6/8':6}[s]||4);

        const initAudio = () => {
            if (!audioCtx.current) { audioCtx.current = new (window.AudioContext || window.webkitAudioContext)(); setAudioReady(true); }
            if (audioCtx.current.state === 'suspended') audioCtx.current.resume();
        };

        const playClick = (time, isDownbeat) => {
            const ctx = audioCtx.current;
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = (accentRef.current && isDownbeat) ? 660 : 500;
            osc.type = 'sine';
            const base = elevenRef.current ? 0.6 : 0.3;
            const vol = (accentRef.current && isDownbeat) ? base * 1.5 : base;
            g.gain.setValueAtTime(vol, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            osc.start(time); osc.stop(time + 0.1);
        };

        const scheduleNote = (beat, time) => {
            try {
                playClick(time, beat === 0);
                setTimeout(() => setCurrentBeat(beat), (time - audioCtx.current.currentTime) * 1000);
            } catch (e) {
                stop();
            }
        };

        const scheduler = () => {
            try {
                while (nextNote.current < audioCtx.current.currentTime + 0.1) {
                    scheduleNote(beatRef.current, nextNote.current);
                    nextNote.current += 60.0 / bpmRef.current;
                    beatRef.current = (beatRef.current + 1) % getBeats(sigRef.current);
                }
                schedulerRef.current = setTimeout(scheduler, 25);
            } catch (e) {
                stop();
            }
        };

        const start = () => { initAudio(); beatRef.current = 0; nextNote.current = audioCtx.current.currentTime; setIsPlaying(true); scheduler(); };
        const stop  = () => { setIsPlaying(false); clearTimeout(schedulerRef.current); schedulerRef.current = null; setCurrentBeat(-1); beatRef.current = 0; };

        const changeBpm = (v) => setBpm(Math.max(40, Math.min(240, v)));
        const press = (id, fn) => { setPressedBtn(id); fn(); setTimeout(() => setPressedBtn(null), 150); };

        const startLP = (i) => {
            lpTimer.current = setTimeout(() => {
                const n = [...presets]; n[i] = bpm; setPresets(n);
                setSavedIdx(i); setTimeout(() => setSavedIdx(null), 1000);
                try { localStorage.setItem('metronome-presets', JSON.stringify(n)); } catch {}
                try { window.navigator.vibrate && window.navigator.vibrate(60); } catch {}
            }, 600);
        };
        const cancelLP = () => clearTimeout(lpTimer.current);

        const beats     = Array.from({ length: getBeats(timeSig) }, (_, i) => i);
        const sliderPct = ((bpm - 40) / 200) * 100;
        const sliderBg  = 'linear-gradient(to right,' + TEAL + ' 0%,' + TEAL + ' ' + sliderPct + '%,' + t.sliderTrack + ' ' + sliderPct + '%,' + t.sliderTrack + ' 100%)';

        const gBtn = (extra={}) => ({
            background: t.btnBg, border: '1px solid ' + t.btnBorder, borderRadius: 12,
            color: t.text, cursor: 'pointer', fontFamily: INTER, fontWeight: 600,
            fontSize: 13, transition: 'all 0.18s ease', ...extra,
        });

        const onHover = (e, on) => {
            e.currentTarget.style.background  = on ? t.btnHover : t.btnBg;
            e.currentTarget.style.borderColor = on ? t.btnBorderHover : t.btnBorder;
            e.currentTarget.style.transform   = on ? 'translateY(-1px)' : '';
        };

        return (
            <div style={{ minHeight:'100vh', background:t.bg, display:'flex', alignItems:'center', justifyContent:'center', padding:16, fontFamily:INTER, transition:'background 0.4s' }}>
                <div style={{ width:'100%', maxWidth:348 }}>
                    <div style={{ background:t.cardBg, backdropFilter:'blur(28px)', WebkitBackdropFilter:'blur(28px)', border:'1px solid ' + t.cardBorder, borderRadius:20, boxShadow:t.cardShadow, padding:24, transition:'all 0.3s', animation:'modeSwitch 0.3s ease' }}>

                        {/* Header */}
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18 }}>
                            <button onClick={() => setShowHelp(true)} style={{ ...gBtn(), display:'flex', alignItems:'center', gap:5, padding:'7px 11px', color:t.textMid }}
                                onMouseEnter={(e) => onHover(e,true)} onMouseLeave={(e) => onHover(e,false)}>
                                <HelpCircle size={14}/> Help
                            </button>
                            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                                <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                                    <div style={{ width:6, height:6, borderRadius:'50%', transition:'all 0.4s', background: audioReady ? '#4ade80' : t.midColor, boxShadow: audioReady ? '0 0 7px #4ade80' : 'none' }}/>
                                    <span style={{ fontFamily:MONO, fontSize:10, letterSpacing:'0.08em', color:t.textDim }}>{audioReady ? 'AUDIO ON' : 'TAP START'}</span>
                                </div>
                                <button onClick={toggleTheme}
                                    style={{ ...gBtn({ padding:'6px 10px', borderRadius:10, fontSize:12, display:'flex', alignItems:'center', gap:4 }), color:t.textMid }}
                                    onMouseEnter={(e) => onHover(e,true)} onMouseLeave={(e) => onHover(e,false)}
                                    title={dark ? 'Switch to light mode' : 'Switch to dark mode'}>
                                    {dark ? <Sun size={14}/> : <Moon size={14}/>}
                                </button>
                            </div>
                            <button onClick={() => setShowAbout(true)} style={{ ...gBtn(), display:'flex', alignItems:'center', gap:5, padding:'7px 11px', color:t.textMid }}
                                onMouseEnter={(e) => onHover(e,true)} onMouseLeave={(e) => onHover(e,false)}>
                                <Info size={14}/> About
                            </button>
                        </div>

                        {/* Wordmark */}
                        <div style={{ textAlign:'left', marginBottom:18 }}>
                            <div style={{ fontFamily:GROTESK, fontWeight:700, fontSize:34, letterSpacing:'-0.01em', color:t.text, lineHeight:1.1, transition:'color 0.3s' }}>Metronome</div>
                            <div style={{ display:'flex', alignItems:'baseline', gap:6, marginTop:8, marginBottom:14 }}>
                                <span style={{ fontFamily:MONO, fontSize:11, letterSpacing:'0.06em', color:t.textMid }}>by</span>
                                <span style={{ fontFamily:MONO, fontWeight:600, fontSize:12, color:TEAL }}>
                                    {'<'}bit{'/>'}
                                </span>
                                <span style={{ fontFamily:CAVEAT, fontWeight:700, fontSize:17, color:t.text, transition:'color 0.3s' }}>Scribbles</span>
                            </div>
                            <div style={{ height:1, background:t.divider }}/>
                        </div>

                        {/* BPM */}
                        <div style={{ textAlign:'center', marginBottom:10, animation: isPlaying ? 'floatUp 2s ease-in-out infinite' : 'none' }}>
                            <div style={{ fontFamily:GROTESK, fontWeight:700, fontSize:84, lineHeight:1, color:t.bpmColor, letterSpacing:'-2px', textShadow:t.bpmShadow, fontVariantNumeric:'tabular-nums', transition:'color 0.3s' }}>{bpm}</div>
                            <div style={{ fontFamily:MONO, fontSize:10, letterSpacing:'0.15em', textTransform:'uppercase', color:t.midColor, marginTop:2 }}>BPM</div>
                        </div>

                        {/* Beat dots */}
                        <div style={{ display:'flex', justifyContent:'center', gap:10, marginBottom:18 }}>
                            {beats.map((b) => {
                                const active = isPlaying && currentBeat === b;
                                const isOne  = b === 0;
                                return (
                                    <div key={b} className={active ? (isOne ? 'beat-amber' : 'beat-teal') : ''}
                                        style={{ width:13, height:13, borderRadius:'50%', transition:'background 0.05s, border-color 0.05s',
                                            background: active ? (isOne ? AMBER : TEAL) : t.dotInactive,
                                            border: '1.5px solid ' + (active ? (isOne ? AMBER : TEAL) : t.dotBorder),
                                        }}/>
                                );
                            })}
                        </div>

                        {/* Slider */}
                        <div style={{ marginBottom:18 }}>
                            <input type="range" min="40" max="240" value={bpm} onChange={(e) => changeBpm(Number(e.target.value))} style={{ background:sliderBg }}/>
                            <div style={{ display:'flex', justifyContent:'space-between', fontFamily:MONO, fontSize:10, color:t.textFaint, marginTop:5 }}>
                                <span>40</span><span>120</span><span>240</span>
                            </div>
                        </div>

                        {/* Presets */}
                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:14 }}>
                            {presets.map((p, i) => {
                                const isSaved   = savedIdx === i;
                                const isCurrent = bpm === p && savedIdx === null;
                                return (
                                    <button key={i}
                                        onClick={() => press('p'+i, () => changeBpm(p))}
                                        onMouseDown={() => startLP(i)} onMouseUp={cancelLP}
                                        onMouseEnter={(e) => onHover(e,true)} onMouseLeave={(e) => { cancelLP(); onHover(e,false); }}
                                        onTouchStart={() => startLP(i)} onTouchEnd={cancelLP} onTouchCancel={cancelLP}
                                        className={pressedBtn==='p'+i ? 'btn-press' : ''}
                                        style={{ ...gBtn({ fontFamily:MONO, fontSize:13, padding:'9px 0' }),
                                            background: isSaved ? 'rgba(242,177,52,0.18)' : isCurrent ? 'rgba(22,179,163,0.15)' : t.btnBg,
                                            borderColor: isSaved ? AMBER : isCurrent ? TEAL : t.btnBorder,
                                            color: isSaved ? AMBER : t.text,
                                        }}>
                                        {isSaved ? '✓ saved' : p}
                                    </button>
                                );
                            })}
                        </div>

                        {/* Start/Stop */}
                        <button onClick={isPlaying ? stop : start}
                            style={{ width:'100%', padding:'13px 0', borderRadius:14, border:'none', cursor:'pointer',
                                fontFamily:GROTESK, fontWeight:700, fontSize:17, color:'#FAFAF9',
                                display:'flex', alignItems:'center', justifyContent:'center', gap:9, marginBottom:12,
                                background: isPlaying ? 'linear-gradient(135deg,#b45309,#92400e)' : 'linear-gradient(135deg,#16B3A3,#0e9688)',
                                boxShadow: isPlaying ? '0 4px 20px rgba(180,83,9,0.4),inset 0 1px 0 rgba(255,255,255,0.1)' : '0 4px 20px rgba(22,179,163,0.35),inset 0 1px 0 rgba(255,255,255,0.1)',
                                animation: isPlaying ? 'pulseGlow 2s ease-in-out infinite' : 'none',
                                transition: 'background 0.25s, box-shadow 0.25s',
                            }}>
                            {isPlaying ? <><Pause size={20} fill="#FAFAF9"/>Stop</> : <><Play size={20} fill="#FAFAF9"/>Start</>}
                        </button>

                        {/* ±BPM */}
                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:7, marginBottom:14 }}>
                            {[[-5,'-5'],[-1,'-1'],[1,'+1'],[5,'+5']].map(([d,lbl]) => (
                                <button key={d} onClick={() => press('d'+d, () => changeBpm(bpm+d))}
                                    onMouseEnter={(e) => onHover(e,true)} onMouseLeave={(e) => onHover(e,false)}
                                    className={pressedBtn==='d'+d ? 'btn-press' : ''}
                                    style={{ ...gBtn({ fontFamily:MONO, fontSize:13, padding:'9px 0' }) }}>
                                    {lbl}
                                </button>
                            ))}
                        </div>

                        {/* Time Signature */}
                        <div>
                            <div style={{ fontFamily:MONO, fontSize:10, letterSpacing:'0.12em', textTransform:'uppercase', color:PURPLE, textAlign:'center', marginBottom:8 }}>Time Signature</div>
                            <div style={{ display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:6, marginBottom:14 }}>
                                {['2/4','3/4','4/4','5/4','6/8'].map((sig) => {
                                    const active = timeSig === sig;
                                    return (
                                        <button key={sig} onClick={() => setTimeSig(sig)}
                                            onMouseEnter={(e) => onHover(e,true)} onMouseLeave={(e) => onHover(e,false)}
                                            style={{ ...gBtn({ fontSize:12, padding:'8px 0' }),
                                                color: active ? '#FAFAF9' : t.textMid,
                                                background: active ? 'rgba(110,86,207,0.25)' : t.btnBg,
                                                borderColor: active ? PURPLE : t.btnBorder,
                                                boxShadow: active ? '0 0 10px rgba(110,86,207,0.2)' : 'none',
                                            }}>
                                            {sig}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Toggles */}
                            <div style={{ borderTop:'1px solid ' + t.divider, paddingTop:12, display:'flex', flexDirection:'column', gap:10, alignItems:'center' }}>
                                <Toggle on={accentBeat} onToggle={toggleAccent} label="ACCENT BEAT ONE" t={t}/>
                                <Toggle on={upToEleven} onToggle={toggleEleven} label="UP TO ELEVEN 🎸" t={t}/>
                            </div>
                        </div>
                    </div>

                    {/* Version */}
                    <div style={{ textAlign:'center', marginTop:12, fontFamily:MONO, fontSize:10, letterSpacing:'0.08em', color:t.textFaint }}>v1.5.0</div>
                </div>

                {/* Help Modal */}
                <Modal isOpen={showHelp} onClose={() => setShowHelp(false)} title="How to Use" t={t}>
                    <Section title="Getting Started">Tap Start to begin — the first beat plays immediately. On mobile, tapping Start also enables the audio engine.</Section>
                    <Section title="Adjusting Tempo">Drag the slider for quick changes, or use the ±1 and ±5 buttons for precision. Changes take effect instantly while playing.</Section>
                    <Section title="Presets">Tap a preset to load that BPM. To save, press and hold a preset for about half a second — it will flash amber and confirm with ✓ saved. Presets survive page reloads.</Section>
                    <Section title="Time Signatures">Choose from 2/4, 3/4, 4/4, 5/4, or 6/8. The beat dots update to match.</Section>
                    <Section title="Beat Indicators"><span style={{ color:AMBER }}>Amber</span> marks beat one. <span style={{ color:TEAL }}>Teal</span> marks the rest. Each dot pulses and glows on every hit.</Section>
                    <Section title="Accent Beat One">Toggle this on to play beat one at a higher pitch (660Hz) and slightly louder than the other beats. Useful for feeling the start of each bar at fast tempos. Off by default. Your preference is saved automatically.</Section>
                    <Section title="Up to Eleven 🎸">Doubles the output volume — for when you need the click to cut through a loud guitar or drummer. Named in honour of Spinal Tap's legendary amp. Your preference is saved automatically.</Section>
                    <Section title="Light / Dark Mode">Tap the sun or moon icon in the header to switch themes. Your preference is saved automatically.</Section>
                </Modal>

                {/* About Modal */}
                <Modal isOpen={showAbout} onClose={() => setShowAbout(false)} title="About" t={t}>
                    <Section title="About This App">This metronome uses the Web Audio API for precise timing with a warm 500Hz tone. Works on desktop and mobile, including iOS.</Section>
                    <Section title="Why I Build These Apps">
                        <p style={{ margin:'0 0 8px' }}>At bitScribbles, I believe the best tools are often the simplest ones. Too many apps are bloated with features you'll never use. My goal is focused tools that do one thing really well — no distractions, no learning curve, just pure functionality.</p>
                        <p style={{ margin:'0 0 8px' }}>Simple doesn't mean basic — it means thoughtfully designed to work seamlessly on the devices you actually use.</p>
                        <p style={{ margin:0 }}>Always working on new tools across different domains — stay tuned.</p>
                    </Section>
                    <Section title="Disclaimer">Provided as-is for practice and educational purposes. No guarantees about timing precision for professional recording use.</Section>
                    <Section title="Contact"><a href="mailto:hubert@bitscribbles.com" style={{ color:t.link }}>hubert@bitscribbles.com</a></Section>
                    <Section title="Support">
                        <p style={{ margin:'0 0 10px' }}>If this app helps your practice, consider buying me a coffee!</p>
                        <a href="https://www.buymeacoffee.com/bitscribbles" target="_blank" rel="noopener noreferrer"
                            style={{ display:'inline-block', background:'linear-gradient(135deg,#F2B134,#d97706)', color:'#14171C', fontFamily:GROTESK, fontWeight:700, fontSize:13, padding:'9px 18px', borderRadius:10, textDecoration:'none' }}>
                            ☕ Buy Me a Coffee
                        </a>
                    </Section>
                    <div style={{ borderTop:'1px solid ' + t.divider, paddingTop:14, textAlign:'center', fontFamily:MONO, fontSize:10, letterSpacing:'0.08em', color:t.textFaint }}>
                        {'/* made with ♪ for musicians everywhere */'}
                    </div>
                </Modal>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Metronome />);
</script>
</body>
</html>
