<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Metronome · bitScribbles</title>
    <meta name="description" content="A steady, good-looking metronome by bitScribbles. 40–240 BPM, tap tempo, time signatures and accent on beat one. Free, no ads, works offline.">

    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="theme-color" content="#14171C">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Metronome">

    <link rel="preload" href="fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url(fonts/space-grotesk-latin-700-normal.woff2) format('woff2')}
        @font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
        @font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
        @font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
        @font-face{font-family:'JetBrains Mono';font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2')}
        @font-face{font-family:'Caveat';font-weight:700;font-display:swap;src:url(fonts/caveat-latin-700-normal.woff2) format('woff2')}

        html { background:#14171C; }
        body { margin:0; padding:0; -webkit-text-size-adjust:100%; }
        .page {
            min-height:100vh; min-height:100dvh; box-sizing:border-box;
            display:flex; align-items:center; justify-content:center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }
        button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .preset, .tap { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        button:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid #16B3A3; outline-offset:2px; }

        @keyframes modalIn   { from{opacity:0;transform:scale(0.88) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);} }
        @keyframes beatPop   { 0%,100%{transform:scale(1);}50%{transform:scale(1.4);} }
        @keyframes floatUp   { 0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);} }
        @keyframes pulseGlow { 0%,100%{box-shadow:0 0 0 0 rgba(180,83,9,0.0),0 4px 20px rgba(20,23,28,0.3);}50%{box-shadow:0 0 0 6px rgba(180,83,9,0.18),0 4px 20px rgba(20,23,28,0.3);} }
        .beat-amber { animation:beatPop 0.14s ease-out; box-shadow:0 0 14px rgba(242,177,52,0.9),0 0 28px rgba(242,177,52,0.4) !important; }
        .beat-teal  { animation:beatPop 0.14s ease-out; box-shadow:0 0 14px rgba(22,179,163,0.9),0 0 28px rgba(22,179,163,0.4) !important; }
        .btn-press  { transform:scale(0.92) !important; }
        /* Hover: a light overlay that never replaces a button's own (selected) colours */
        @media (hover: hover) {
            main button:not(.plain):hover { background-image:linear-gradient(rgba(128,128,128,0.12),rgba(128,128,128,0.12)) !important; transform:translateY(-1px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .beat-amber, .beat-teal { animation:none; }
            .btn-press { transform:none !important; }
            main button:hover { transform:none !important; }
        }

        input[type=range] { -webkit-appearance:none; appearance:none; height:5px; border-radius:99px; outline:none; cursor:pointer; width:100%; display:block; margin:8px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; cursor:pointer; box-shadow:0 1px 8px rgba(20,23,28,0.25),0 0 0 3px rgba(22,179,163,0.3); transition:box-shadow 0.2s; }
        input[type=range]::-webkit-slider-thumb:hover { box-shadow:0 1px 12px rgba(20,23,28,0.35),0 0 0 5px rgba(22,179,163,0.35); }
        input[type=range]::-moz-range-thumb { width:22px; height:22px; border-radius:50%; background:#fff; border:none; cursor:pointer; }
    </style>
    <script>
        // Paint the right background before the app loads, so light mode doesn't flash dark
        try { if (localStorage.getItem('bs-theme') === 'light') document.documentElement.style.background = '#e8f7f6'; } catch (e) {}
    </script>
</head>
<body>
<div id="root"></div>
<noscript><p style="color:#FAFAF9;font-family:sans-serif;text-align:center;padding:2em">Metronome needs JavaScript turned on.</p></noscript>
<!-- app.js is built from src/app.jsx — see README.md -->
<script src="app.js" defer></script>
<script>
    // Works offline after the first visit
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
</script>
</body>
</html>
